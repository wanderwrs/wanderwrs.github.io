<!-- 封存状态：暗号输入 -->
<main id="screen-locked" class="screen screen--locked" data-screen="locked">
  <div class="seal" aria-hidden="true">
    <div class="seal__disc">
      <span class="seal__mark">封</span>
    </div>
  </div>

  <header class="screen__head">
    <h1 class="screen__title">这里有些话</h1>
    <p class="screen__hint">留给特定的人。<br>下面三道题，答得上来，门就会开。</p>
  </header>

  <form id="code-form" class="code-form" autocomplete="off" novalidate>
    <ol class="quiz" id="quiz">
      <li class="quiz__item">
        <label class="quiz__label" for="q-nickname">我一般怎么称呼你？</label>
        <input type="text" id="q-nickname" class="quiz__input" data-q="nickname" autocomplete="off" spellcheck="false">
      </li>
      <li class="quiz__item">
        <label class="quiz__label" for="q-birthday">你的生日（例：20030314）</label>
        <input type="text" id="q-birthday" class="quiz__input" data-q="birthday" inputmode="numeric" autocomplete="off" spellcheck="false">
      </li>
      <li class="quiz__item">
        <label class="quiz__label" for="q-relation">我跟你之间的关系是什么？</label>
        <input type="text" id="q-relation" class="quiz__input" data-q="relation" autocomplete="off" spellcheck="false">
      </li>
    </ol>

    <button type="submit" class="code-submit" id="code-submit">启封</button>
    <p id="code-error" class="code-error" role="alert" aria-live="polite" hidden></p>
  </form>

  <footer class="screen__foot">
    <a class="screen__back" href="index.html">← 返回前言</a>
  </footer>
</main>

<!-- 启封状态：留给那个人的话 -->
<main id="screen-unlocked" class="screen screen--unlocked" data-screen="unlocked" hidden>
  <article class="letter" id="letter">
    <header class="letter__header">
      <p class="letter__recipient" id="letter-recipient">致</p>
      <h1 class="letter__title" id="letter-title"></h1>
    </header>

    <div class="letter__body" id="letter-body" tabindex="0"></div>

    <footer class="letter__footer">
      <span class="letter__sign" id="letter-sign"></span>
      <time class="letter__date" id="letter-date"></time>
    </footer>
  </article>

  <button type="button" id="seal-again" class="seal-again">重新封存</button>
</main>

<script>
  document.querySelectorAll('.nav-drop').forEach(function (drop) {
    var btn = drop.querySelector('.nav-drop-btn');
    function setOpen(open) {
      drop.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      setOpen(!drop.classList.contains('open'));
    });
    document.addEventListener('click', function (e) {
      if (!drop.contains(e.target)) setOpen(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setOpen(false);
    });
    drop.querySelectorAll('.nav-drop-menu a').forEach(function (a) {
      a.addEventListener('click', function () { setOpen(false); });
    });
  });
</script>
