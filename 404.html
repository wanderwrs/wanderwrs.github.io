<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="404 · 信号丢失：这片空域没有找到你要的页面。">
<meta name="theme-color" content="#FAF6EC">
<title>404 · 信号丢失 · Wanderers.小石头</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231F7A5C'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23FAF6EC' font-family='PingFang SC, Microsoft YaHei, sans-serif'%3E石%3C/text%3E%3C/svg%3E">
<script>
/* 主题预载（防闪烁）：本地记忆 > 系统偏好（wx-enhance） */
(function(){try{var t=localStorage.getItem('wxTheme');if(t!=='dark'&&t!=='light'){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}if(t==='dark'){document.documentElement.setAttribute('data-theme','dark');}}catch(e){}})();
</script>
<style>
  :root {
    --paper: #FAF6EC;
    --paper-2: #F4EFE2;
    --ink: #23302A;
    --ink-2: #5C6B62;
    --line: #E7E1D2;
    --accent: #1F7A5C;
    --accent-deep: #155C44;
    --sky: #4E9FCB;
    --chip: #F1ECDE;
    --panel: #fff;
    --glass: rgba(250, 246, 236, 0.92);
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
    --sans: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
  }
  html[data-theme="dark"] {
    --paper: #141F1A;
    --paper-2: #1A2721;
    --ink: #D8E1DB;
    --ink-2: #93A49A;
    --line: #2C3A32;
    --accent: #3BA37F;
    --accent-deep: #7BCBA8;
    --sky: #7CBBD9;
    --chip: #203028;
    --panel: #1B2721;
    --glass: rgba(20, 31, 26, 0.92);
    color-scheme: dark;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans);
    background:
      linear-gradient(rgba(31, 122, 92, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31, 122, 92, 0.05) 1px, transparent 1px),
      radial-gradient(780px 480px at 50% 112%, rgba(78, 159, 203, 0.09), transparent 62%),
      var(--paper);
    background-size: 64px 64px, 64px 64px, auto, auto;
    color: var(--ink);
    line-height: 1.75;
    font-size: 16px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(78, 159, 203, 0.25); }
  a { color: var(--accent); text-decoration: none; }
  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: var(--glass); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; height: 58px; padding: 0 24px; }
  .brand { font-family: var(--mono); font-size: 0.92rem; font-weight: 600; color: var(--ink); letter-spacing: 0.02em; }
  .brand .dot { color: var(--accent); }
  .nav-links { display: flex; gap: 22px; align-items: center; }
  .nav-links a { color: var(--ink-2); font-size: 0.9rem; }
  .nav-links a:hover { color: var(--accent); }
  .theme-btn {
    appearance: none; border: 1px solid var(--line); border-radius: 6px;
    background: var(--panel); color: var(--ink);
    font-family: var(--mono); font-size: 0.9rem; line-height: 1;
    width: 30px; height: 30px; cursor: pointer; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, color 0.2s;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

  .lost { text-align: center; padding: 96px 24px 64px; }
  .lost-code {
    font-family: var(--mono); font-size: clamp(4.6rem, 14vw, 7.4rem);
    font-weight: 700; letter-spacing: 0.06em; line-height: 1;
    color: var(--accent);
    text-shadow: 6px 6px 0 rgba(78, 159, 203, 0.14);
  }
  .lost-stage { width: min(380px, 80vw); margin: 10px auto 6px; overflow: visible; }
  .lost-tag {
    font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.3em;
    color: var(--ink-2); margin-bottom: 10px;
  }
  .lost-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
  .lost-desc { font-size: 0.9rem; color: var(--ink-2); max-width: 400px; margin: 0 auto 26px; }
  .btn-home {
    display: inline-block; font: inherit; font-size: 0.92rem; font-weight: 600;
    padding: 10px 26px; border: 1px solid var(--accent); border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .btn-home:hover { background: var(--accent-deep); color: #fff; text-decoration: none; transform: translateY(-1px); }
  .lost-alt { margin-top: 14px; font-size: 0.8rem; color: var(--ink-2); }

  .sp-earth { fill: none; stroke: rgba(35, 48, 42, 0.42); stroke-width: 1.5; stroke-linecap: round; }
  .sp-trail { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 7; stroke-linecap: round; }
  .sp-rocket { fill: none; stroke: var(--accent-deep); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .sp-star { fill: none; stroke: rgba(78, 159, 203, 0.75); stroke-width: 1.4; stroke-linecap: round; }
  .sp-star.s2 { stroke: rgba(31, 122, 92, 0.65); }
  .read-progress {
    position: fixed; top: 0; left: 0; z-index: 200;
    width: 0; height: 2px; border-radius: 0 2px 2px 0;
    background: linear-gradient(90deg, var(--accent), var(--sky));
    pointer-events: none;
  }
  .back-top {
    position: fixed; right: 26px; bottom: 26px; z-index: 90;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--ink-2); font-family: var(--mono); font-size: 1.1rem; cursor: pointer;
    box-shadow: 0 8px 18px rgba(35, 48, 42, 0.16);
    opacity: 0; pointer-events: none; transform: translateY(8px);
    transition: opacity 0.25s, transform 0.25s, color 0.2s, border-color 0.2s;
  }
  .back-top.show { opacity: 1; pointer-events: auto; transform: none; }
  .back-top:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">wanderers<span class="dot">.</span>小石头</a>
    <nav class="nav-links" aria-label="页面导航">
      <a href="index.html">返回主页</a>
    </nav>
  </div>
</header>

<main class="lost">
  <p class="lost-code">404</p>
  <svg class="lost-stage" viewBox="0 0 320 190" aria-hidden="true">
    <path class="sp-star" transform="translate(52,44)" d="M 0 -5 L 0 5 M -5 0 L 5 0" />
    <path class="sp-star s2" transform="translate(268,30)" d="M 0 -5 L 0 5 M -5 0 L 5 0" />
    <path class="sp-star" transform="translate(232,58)" d="M 0 -4 L 0 4 M -4 0 L 4 0" />
    <path class="sp-trail" d="M 6 168 Q 90 118 150 116" />
    <path class="sp-trail" d="M 196 112 Q 260 104 314 46" />
    <path class="sp-earth" d="M 4 178 Q 160 118 316 178" />
    <g class="sp-rocket" transform="translate(152,112) rotate(-8)">
      <path d="M 0 0 C 5 -4.5, 11 -4.5, 15 0 C 11 4.5, 5 4.5, 0 0 Z" />
      <path d="M 15 0 L 24 0 M 16.5 -2 L 21.5 -4.5 M 16.5 2 L 21.5 4.5" />
      <circle cx="6" cy="0" r="1.3" />
    </g>
  </svg>
  <p class="lost-tag">SIGNAL LOST</p>
  <h1 class="lost-title">信号丢失，页面未找到</h1>
  <p class="lost-desc">这片空域没有找到你要的页面。也许链接已经失效，也许航线临时改道——回到发射台重新出发吧。</p>
  <a class="btn-home" href="index.html">返回发射台</a>
  <p class="lost-alt">或从 <a href="index.html#works">作品区</a> / <a href="index.html#notes">站点日志</a> 继续浏览</p>
</main>

<script>
/* 全站增强：夜航切换 · 阅读进度 · 返回顶部（wx-enhance） */
(function () {
  var de = document.documentElement;
  var btn = document.querySelector('.theme-btn');
  if (!btn) {
    btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'theme-btn';
    var nav = document.querySelector('.nav-links') || document.querySelector('.topbar-inner');
    if (nav) { nav.appendChild(btn); }
  }
  btn.title = '切换 夜航 / 白昼 主题';
  var setIcon = function () { btn.textContent = de.getAttribute('data-theme') === 'dark' ? '☀' : '☾'; };
  btn.addEventListener('click', function () {
    var next = de.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    if (next === 'dark') { de.setAttribute('data-theme', 'dark'); } else { de.removeAttribute('data-theme'); }
    try { localStorage.setItem('wxTheme', next); } catch (e) {}
    setIcon();
  });
  setIcon();
  var prog = document.createElement('i');
  prog.className = 'read-progress';
  document.body.appendChild(prog);
  var top = document.createElement('button');
  top.type = 'button';
  top.className = 'back-top';
  top.title = '返回顶部';
  top.textContent = '↑';
  top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });
  document.body.appendChild(top);
  var upd = function () {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    prog.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    if (h.scrollTop > 600) { top.classList.add('show'); } else { top.classList.remove('show'); }
  };
  window.addEventListener('scroll', upd, { passive: true });
  window.addEventListener('resize', upd);
  upd();
})();
</script>
</body>
</html>
